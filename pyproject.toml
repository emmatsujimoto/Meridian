[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian-gas-planner"
version = "0.1.0"
description = "Synthetic industrial-gas inventory planning with Stockpyl"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "licenses/*.txt"]
dependencies = [
  "numpy>=2.2,<3", "scipy>=1.15,<2", "networkx>=3.4,<4",
  "jsonpickle>=4.1,<5", "tabulate>=0.9,<1", "tqdm>=4.67,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "build>=1.2,<2"]

[project.scripts]
meridian = "meridian.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stockpyl = ["datasets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
include = ["src/meridian/**/*.py", "tests/meridian/**/*.py", "scripts/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
source = ["meridian"]

[tool.coverage.report]
show_missing = true
