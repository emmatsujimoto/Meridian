name: Python checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Check new code
        run: |
          python -m ruff check src/meridian tests/meridian scripts
          python -m ruff format --check src/meridian tests/meridian scripts
          python scripts/check_repository.py
      - name: Tests
        run: python -m pytest --cov=meridian --cov-report=term-missing
      - name: Example and packaging
        run: |
          python -m meridian run --data data/synthetic_sites.csv --config config/quickstart.json --output results
          python -m build --no-isolation
